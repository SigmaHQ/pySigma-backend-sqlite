[project]
name = "pySigma-backend-sqlite"
version = "2.0.0"
requires-python = ">=3.10,<4.0"
dependencies = ["pysigma>=1.5.0,<2.0"]
description = "pySigma sqlite backend"
readme = "README.md"
authors = [
    { name = "wagga" }
]
license = "LGPL-3.0-only"

[tool.poetry]
packages = [
    { include = "sigma" }
]

[tool.poetry.group.dev.dependencies]
black = "^24.1"
pytest = "^8.0"
pytest-cov = "^4.1"
coverage = "^7.4"


[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Suppress pyparsing deprecation warning from pySigma library
    "ignore:'parseString' deprecated:DeprecationWarning",
]

[tool.pdm]
[tool.pdm.dev-dependencies]
dev = []

[tool.pdm.build]
includes = ["sigma"]
[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Repository = "https://github.com/SigmaHQ/pySigma-backend-sqlite"
